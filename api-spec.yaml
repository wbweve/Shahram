  # ─── Round-19: watchdog, forecast accuracy, attestation export, compliance ──
  /api/watchdog/status:
    get:
      tags: [Trust]
      summary: Verify all chains + trust score + last attestation
      description: Runs every chain (audit, workspace history, approvals, finance, evidence, decisions) through its verifier and returns the snapshot, the 0-100 trust score, and the latest daily attestation state.
      responses:
        "200": { description: Chain snapshot + trust score + attestation state }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/watchdog/attest:
    post:
      tags: [Trust]
      summary: Sign the daily attestation
      description: Verifies all chains, computes the trust score, cuts a fresh chain anchor and emits a manifest-hashed attestation persisted on the attestation chain.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                asOf: { type: string, format: date }
      responses:
        "201": { description: Attestation signed + verified }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/watchdog/verify:
    post:
      tags: [Trust]
      summary: Verify an attestation manifest (tamper check)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                attestation: { type: object }
      responses:
        "200": { description: Valid/invalid + expected hash }

  /api/forecasts:
    get:
      tags: [Finance]
      summary: Forecast register + accuracy
      responses:
        "200": { description: Forecasts + MAPE accuracy + due-for-actual }
    post:
      tags: [Finance]
      summary: Register a numeric forecast (metric, value, horizon)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id, metric, value]
              properties:
                id: { type: string }
                metric: { type: string }
                value: { type: number }
                horizonDays: { type: number, default: 30 }
                madeAt: { type: string, format: date }
      responses:
        "201": { description: Registered }
        "400": { $ref: "#/components/responses/BadRequest" }

  /api/forecasts/actual:
    post:
      tags: [Finance]
      summary: Record the actual for a forecast (grades it at maturity)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id, value]
              properties:
                id: { type: string }
                value: { type: number }
                actualAt: { type: string, format: date }
      responses:
        "200": { description: Graded forecast }
        "400": { $ref: "#/components/responses/BadRequest" }

  /api/attestation/export:
    get:
      tags: [Trust]
      summary: Export payload for the external notary
      responses:
        "200": { description: Signed attestation bundle + notary URL }
        "404": { description: No attestation yet }
    post:
      tags: [Trust]
      summary: Publish the attestation to the configured notary
      description: Posts the signed bundle to LEADERSHIP_NOTARY_URL with HMAC. 502 + honest reason when no notary is configured or it is unreachable — never faked success.
      responses:
        "200": { description: Notarized receipt }
        "502": { description: Notary unreachable / not configured }

  /api/compliance/calendar:
    get:
