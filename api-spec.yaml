components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: API token (set via LEADERSHIP_API_TOKEN or LEADERSHIP_API_TOKENS env var)
    ApiTokenAuth:
      type: apiKey
      in: header
      name: Authorization
      description: Alternative: Bearer <token>

  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
    Unauthorized:
      description: Missing or invalid credentials
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string

  schemas:
    HealthResponse:
      type: object
      properties:
        ok:
          type: boolean
        service:
          type: string
        audit:
          $ref: "#/components/schemas/IntegrityResult"
        workspaceHistory:
          $ref: "#/components/schemas/IntegrityResult"
        approvals:
          $ref: "#/components/schemas/IntegrityResult"
        events:
          $ref: "#/components/schemas/IntegrityResult"
        deep:
          type: object
          properties:
            diskWritable:
              type: boolean
            jsonlCorrupt:
              type: boolean
            diskSpaceMB:
              type: number

    IntegrityResult:
      type: object
      properties:
        valid:
          type: boolean
        checked:
          type: integer
        brokenAt:
          type: integer
          nullable: true

    ReadinessResponse:
      type: object
      required: [status, score, passed, total, criticalFailures, gates]
      properties:
        generatedAt:
          type: string
          format: date-time
        status:
          type: string
          enum: [READY, NOT_READY]
        score:
          type: integer
          minimum: 0
          maximum: 100
        passed:
          type: integer
        total:
          type: integer
        criticalFailures:
          type: integer
        gates:
          type: array
          items:
            type: object
            required: [id, label, passed, detail, severity]
            properties:
              id: { type: string }
              label: { type: string }
              passed: { type: boolean }
              detail: { type: string }
              severity: { type: string }

    InboundDomainEvent:
      type: object
      required: [id, type, connectorId, tenantId, occurredAt]
      properties:
        id:
          type: string
        type:
          type: string
        connectorId:
          type: string
        tenantId:
          type: string
        occurredAt:
          type: string
          format: date-time
        correlationId:
          type: string
        signature:
          type: string
        payload:
          type: object

    ConnectorCheckpoint:
      type: object
      required: [connectorId, tenantId]
      properties:
        connectorId:
          type: string
        tenantId:
          type: string
        cursor:
          type: string
        imported:
          type: integer

    ConnectorFailure:
      type: object
      required: [connectorId, tenantId, error]
      properties:
        connectorId:
          type: string
        tenantId:
          type: string
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string

    FinanceJournalEntry:
      type: object
      required: [id, date, currency, lines]
      properties:
        id:
          type: string
        date:
          type: string
          format: date
        currency:
          type: string
        amount:
          type: number
        approvedBy:
          type: string
        status:
          type: string
          enum: [draft, posted, reconciled, void]
        lines:
          type: array
          minItems: 2
          items:
            type: object
            properties:
              account:
                type: string
              debit:
                type: number
              credit:
                type: number

    Workspace:
      type: object
      properties:
        projects:
          type: object
        order:
          type: array
          items:
            type: string
        activeId:
          type: string
          nullable: true
        brand:
          type: object

    WorkspaceResponse:
      type: object
      properties:
        workspace:
          $ref: "#/components/schemas/Workspace"
        revision:
          type: string

    HistoryEntry:
      type: object
      properties:
        id:
          type: string
          format: uuid
        ts:
          type: string
          format: date-time
        revision:
          type: integer
        hash:
          type: string
        checksum:
          type: string

    AuditEntry:
      type: object
      properties:
        id:
          type: string
          format: uuid
        eventId:
          type: string
        ts:
          type: string
          format: date-time
        action:
          type: string
        detail:
          type: string
        checksum:
          type: string

    ApprovalEntry:
      type: object
      properties:
        id:
          type: string
          format: uuid
        ts:
          type: string
          format: date-time
        title:
          type: string
        status:
          type: string
        stage:
          type: string
        approver:
          type: string
        role:
          type: string
        dueDate:
          type: string
        requiredApprovers:
          type: array
          items:
            type: string
        evidence:
          type: string
        decisionId:
          type: string
        checksum:
          type: string

    GovernanceResponse:
      type: object
      properties:
        decisions:
          type: array
          items:
            type: object
        actions:
          type: array
          items:
            type: object
        summary:
          type: object
        revision:
          type: string

    Alert:
      type: object
      properties:
        projectId:
          type: string
        domain:
          type: string
        type:
          type: string
        item:
          type: string
        amount:
          type: number
        priority:
          type: string

    AutomationResponse:
      type: object
      properties:
        asOf:
          type: string
          format: date
        jobs:
          type: array
          items:
            type: object
        total:
          type: integer
        humanApprovalJobs:
          type: integer
        summary:
          type: string