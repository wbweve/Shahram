openapi: "3.1.0"
info:
  title: Leadership Platform API
  version: "1.0.0"
  description: |
    Bilingual (Danish/English) engineering project & personal leadership platform.
    Fully click-only design — every text field maps to a curated vocabulary.
    All write endpoints are hash-chained and fsync'd for tamper-evident integrity.
  contact:
    name: Leadership Platform Team
  license:
    name: ISC

servers:
  - url: http://localhost:8001
    description: Local development server
  - url: https://leadership.example.com
    description: Production (example)

security:
  - BearerAuth: []
  - ApiTokenAuth: []

tags:
  - name: Health
    description: Liveness, readiness, and deep system health
  - name: Metrics
    description: Prometheus-compatible metrics endpoint
  - name: Workspace
    description: Full workspace state with hash-chained history
  - name: Audit
    description: Tamper-evident audit log
  - name: Approvals
    description: Governance approval ledger
  - name: Governance
    description: Decisions, actions, and governance summary
  - name: Alerts
    description: Automated workspace alerts (risk, finance, controls)
  - name: Automation
    description: Governed automation job queue
  - name: DanishHR
    description: Danish public-sector personnel leadership — MUS, APV, trivsel, 1-5-10, tavlemøde, situationsbestemt ledelse, offentlig-ledelse models, rekruttering, employment cycle, ledelsesgrundlag, uddannelsesplan, fastholdelse

paths:
  # ─── Health ──────────────────────────────────────────────────────────────────
  /api/health:
    get:
      tags: [Health]
      summary: Deep health check
      description: Returns liveness, audit integrity, workspace history integrity, approvals integrity, and deep system checks (disk writability, JSONL corruption, disk space).
      security: []
      responses:
        "200":
          description: System is healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  # ─── Metrics ─────────────────────────────────────────────────────────────────
  /api/metrics:
    get:
      tags: [Metrics]
      summary: Prometheus-compatible metrics
      description: Returns request counts, error counts, connection counts, storage sizes, and memory usage.
      security: []
      responses:
        "200":
          description: Metrics in text/plain Prometheus format
          content:
            text/plain:
              schema:
                type: string

  /api/readiness:
    get:
      tags: [Health]
      summary: Evidence-backed platform readiness
      description: Returns fail-closed readiness gates for tenancy, authorization, schema, integrity, automation, finance, recovery, privacy, and AI governance.
      responses:
        "200":
          description: Readiness report; individual gates may be NOT_READY.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          description: Readiness evidence could not be evaluated

  # ─── Finance journal ─────────────────────────────────────────────────────────
  /api/finance/journal:
    get:
      tags: [Finance]
      summary: Read the chained finance journal
      responses:
        "200":
          description: Journal entries with integrity verification
          content:
            application/json:
              schema:
                type: object
                required: [entries, integrity]
                properties:
                  entries:
                    type: array
                    items:
                      $ref: "#/components/schemas/FinanceJournalEntry"
                  integrity:
                    $ref: "#/components/schemas/IntegrityResult"
    post:
      tags: [Finance]
      summary: Post a balanced journal entry
      description: Requires editor authorization. Entries above the configured approval threshold require approvedBy.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FinanceJournalEntry"
      responses:
        "201":
          description: Journal entry posted
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          description: Approval required for consequential financial entry

  /api/finance/period-close:
    post:
      tags: [Finance]
      summary: Close an accounting period
      description: Requires admin authorization, a clean server journal, and a closing actor distinct from the approver.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [period, actor, approvedBy]
              properties:
                period:
                  type: object
                  required: [id]
                actor:
                  type: string
                approvedBy:
                  type: string
      responses:
        "201":
          description: Period closed
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Segregation of duties violation

  /api/finance/operations:
    get:
      tags: [Finance]
      summary: Read persisted invoices, purchase orders, and receipts
      responses:
        "200":
          description: Finance operations and integrity status
    post:
      tags: [Finance]
      summary: Save a validated finance operation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type, record, actor]
              properties:
                type:
                  type: string
                  enum: [invoice, purchase_order, receipt]
                record:
                  type: object
                actor:
                  type: string
      responses:
        "201":
          description: Finance operation saved
        "400":
          $ref: "#/components/responses/BadRequest"

  /api/finance/three-way-match:
    post:
      tags: [Finance]
      summary: Match a purchase order, receipt, and invoice
      responses:
        "200":
          description: Documents matched
        "409":
          description: Match exception requires review

  /api/finance/payment-instructions:
    post:
      tags: [Finance]
      summary: Authorize a payment instruction
      description: Requires an invoice that passes server-derived three-way matching and approval by someone other than the payment actor. This endpoint does not transfer funds.
      responses:
        "201":
          description: Payment instruction authorized pending bank execution
        "403":
          description: Payment authorization denied

  /api/privacy/consent:
    post:
      tags: [Workspace]
      summary: Grant or withdraw purpose-bound consent
      description: Requires editor authorization and at-rest encryption; consent metadata is persisted in an integrity-checked ledger.
      responses:
        "201":
          description: Consent decision recorded
        "400":
          $ref: "#/components/responses/BadRequest"
        "503":
          description: Privacy encryption is not configured

  /api/privacy/check:
    post:
      tags: [Workspace]
      summary: Check whether a purpose-bound data use is allowed
      responses:
        "200":
          description: Consent decision
        "503":
          description: Privacy encryption is not configured
        "404":
          description: Required finance operation not found

  /api/finance/bank-feed:
    post:
      tags: [Finance]
      summary: Persist bank-feed transactions
      responses:
        "201":
          description: Bank transactions imported
        "400":
          $ref: "#/components/responses/BadRequest"

  /api/finance/rates:
    post:
      tags: [Finance]
      summary: Persist a sourced exchange rate
      responses:
        "201":
          description: Exchange rate recorded
        "400":
          $ref: "#/components/responses/BadRequest"

  /api/finance/reconcile:
    post:
      tags: [Finance]
      summary: Reconcile stored bank transactions against the ledger
      responses:
        "200":
          description: Reconciliation passed
        "409":
          description: Reconciliation exceptions require review

  # ─── Risk assessment ────────────────────────────────────────────────────────
  /api/risk/assessment:
    get:
      tags: [Alerts]
      summary: Read governed risk assessments
      description: Returns residual risk, appetite decisions, control-test status, evidence gaps, and workspace revision for the authorized scope.
      responses:
        "200":
          description: Risk assessments
          content:
            application/json:
              schema:
                type: object
                required: [assessments, appetiteRpn, evidenceRequired, revision]
                properties:
                  assessments:
                    type: array
                    items:
                      type: object
                      required: [riskId, residual, appetite, controls]
                      properties:
                        riskId:
                          type: string
                        title:
                          type: string
                        residual:
                          type: object
                        appetite:
                          type: object
                        controls:
                          type: array
                          items:
                            type: object
                  appetiteRpn:
                    type: number
                  evidenceRequired:
                    type: integer
                  revision:
                    type: string

  # ─── Entity graph ───────────────────────────────────────────────────────────
  /api/graph:
    get:
      tags: [Workspace]
      summary: Read the role-scoped entity graph
      description: Returns validated project, register, and cross-register relationship nodes derived from the authorized workspace view.
      responses:
        "200":
          description: Entity graph with validation result and workspace revision
          content:
            application/json:
              schema:
                type: object
                required: [graph, integrity, revision]
                properties:
                  graph:
                    type: object
                    properties:
                      version:
                        type: integer
                      nodes:
                        type: array
                        items:
                          type: object
                      edges:
                        type: array
                        items:
                          type: object
                  integrity:
                    $ref: "#/components/schemas/IntegrityResult"
                  revision:
                    type: string

  # ─── Domain events ──────────────────────────────────────────────────────────
  /api/events:
    get:
      tags: [Audit]
      summary: Read the hash-chained domain event stream
      description: Returns typed business events for replay and lineage. Requires auditor authorization.
      responses:
        "200":
          description: Domain events with integrity verification
          content:
            application/json:
              schema:
                type: object
                required: [events, integrity]
                properties:
                  events:
                    type: array
                    items:
                      type: object
                  integrity:
                    $ref: "#/components/schemas/IntegrityResult"
    post:
      tags: [Audit]
      summary: Ingest an authenticated connector event
      description: Validates event identity, tenant binding, freshness, and source-event idempotency before appending an audit-backed domain event.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InboundDomainEvent"
      responses:
        "201":
          description: Domain event ingested

  /api/canonical-records:
    get:
      tags: [Audit]
      summary: Read tenant-scoped canonical records
      description: Returns durable records with provenance and correlation metadata. Requires auditor authorization and PostgreSQL persistence.
      responses:
        "200":
          description: Canonical records
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          description: PostgreSQL persistence is required
    post:
      tags: [Audit]
      summary: Atomically save a canonical record and audit event
      description: The server derives tenant identity and persists the record and linked event in one PostgreSQL transaction.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [record, event]
              properties:
                record:
                  type: object
                event:
                  type: object
      responses:
        "201":
          description: Canonical record and event saved
        "200":
          description: Duplicate event replay
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          description: PostgreSQL persistence is required

  /api/connectors:
    get:
      tags: [Workspace]
      summary: Read durable connector worker state
      responses:
        "200":
          description: Connector states and hash-chain integrity

  /api/connectors/config:
    get:
      tags: [Workspace]
      summary: Read redacted connector configuration metadata
      responses:
        "200":
          description: Connector metadata without secrets
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [Workspace]
      summary: Save encrypted connector configuration
      description: Requires admin authorization and LEADERSHIP_DATA_ENCRYPTION_KEY; secrets are never returned.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id, type, tenantId]
              properties:
                id:
                  type: string
                type:
                  type: string
                tenantId:
                  type: string
                baseUrl:
                  type: string
                token:
                  type: string
                refreshToken:
                  type: string
                clientSecret:
                  type: string
      responses:
        "201":
          description: Encrypted configuration saved
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          description: Encryption key unavailable or storage failure

  /api/connectors/checkpoint:
    post:
      tags: [Workspace]
      summary: Persist a connector synchronization checkpoint
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConnectorCheckpoint"
      responses:
        "201":
          description: Checkpoint recorded
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/connectors/failure:
    post:
      tags: [Workspace]
      summary: Record connector failure and schedule retry or dead-letter
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConnectorFailure"
      responses:
        "201":
          description: Failure recorded

  /api/connectors/dead-letter:
    get:
      tags: [Workspace]
      summary: Inspect dead-lettered connector states
      responses:
        "200":
          description: Dead-lettered connectors and state-chain integrity

  /api/connectors/retry-due:
    get:
      tags: [Workspace]
      summary: List connector retries ready for worker pickup
      description: Returns durable retries without claiming them; a configured external adapter must execute the work.
      responses:
        "200":
          description: Due retries and state-chain integrity
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/connectors/replay:
    post:
      tags: [Workspace]
      summary: Replay a dead-lettered connector
      description: Requires admin authorization and creates an audited replay transition.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [connectorId, actor]
              properties:
                connectorId:
                  type: string
                actor:
                  type: string
      responses:
        "201":
          description: Connector replay scheduled
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/connectors/writeback:
    post:
      tags: [Workspace]
      summary: Execute an approved external connector mutation
      description: Requires admin authorization, approved-by evidence, requester/approver separation, encrypted connector configuration, and durable idempotency.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [connectorId, externalId, changes, actor, approval]
              properties:
                connectorId:
                  type: string
                externalId:
                  type: string
                changes:
                  type: object
                actor:
                  type: string
                approval:
                  type: object
                  required: [status, approvedBy]
      responses:
        "201":
          description: External mutation completed
        "200":
          description: Mutation already executed for this idempotency key
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Approval or policy denied
        "409":
          description: Connector does not support write-back
        "503":
          description: Connector or encrypted configuration unavailable
        "409":
          description: Connector is not dead-lettered
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "200":
          description: Duplicate source event already ingested
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  # ─── Workspace ───────────────────────────────────────────────────────────────
  /api/workspace:
    get:
      tags: [Workspace]
      summary: Get current workspace
      description: Returns the full workspace state, redacted for viewer/auditor roles (sensitive registers emptied).
      responses:
        "200":
          description: Current workspace with revision
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
    put:
      tags: [Workspace]
      summary: Save workspace
      description: Persist the full workspace. Supports If-Match header for optimistic concurrency. Non-admins cannot modify approval records.
      parameters:
        - name: If-Match
          in: header
          description: Expected revision for optimistic concurrency
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Workspace"
      responses:
        "200":
          description: Workspace saved
          content:
            application/json:
              schema:
                type: object
                properties:
                  saved:
                    type: boolean
                  revision:
                    type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Approval modification requires admin
        "409":
          description: Revision conflict
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  revision:
                    type: string

  /api/workspace/history:
    get:
      tags: [Workspace]
      summary: Workspace revision history
      description: Returns all saved revisions with integrity verification. Requires auditor role.
      responses:
        "200":
          description: History with integrity check
          content:
            application/json:
              schema:
                type: object
                properties:
                  history:
                    type: array
                    items:
                      $ref: "#/components/schemas/HistoryEntry"
                  integrity:
                    $ref: "#/components/schemas/IntegrityResult"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/workspace/restore:
    post:
      tags: [Workspace]
      summary: Restore a previous revision
      description: Roll back the workspace to a specific revision. Requires editor role.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [revision]
              properties:
                revision:
                  type: string
      responses:
        "200":
          description: Workspace restored
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Revision not found or integrity check failed

  # ─── Audit ───────────────────────────────────────────────────────────────────
  /api/audit:
    get:
      tags: [Audit]
      summary: Get audit log
      description: Returns the full hash-chained audit log with integrity verification. Requires auditor role.
      responses:
        "200":
          description: Audit entries with integrity
          content:
            application/json:
              schema:
                type: object
                properties:
                  entries:
                    type: array
                    items:
                      $ref: "#/components/schemas/AuditEntry"
                  integrity:
                    $ref: "#/components/schemas/IntegrityResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [Audit]
      summary: Append audit entry
      description: Add an event to the hash-chained audit log. Requires editor role.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action:
                  type: string
                  maxLength: 120
                detail:
                  type: string
                eventId:
                  type: string
      responses:
        "201":
          description: Audit entry created
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  # ─── Approvals ───────────────────────────────────────────────────────────────
  /api/approvals:
    get:
      tags: [Approvals]
      summary: Get approval ledger
      description: Returns the hash-chained approval ledger with integrity verification. Requires auditor role.
      responses:
        "200":
          description: Approval entries with integrity
          content:
            application/json:
              schema:
                type: object
                properties:
                  entries:
                    type: array
                    items:
                      $ref: "#/components/schemas/ApprovalEntry"
                  integrity:
                    $ref: "#/components/schemas/IntegrityResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [Approvals]
      summary: Create approval record
      description: Add an approval to the hash-chained ledger. Deduplicates on decisionId. Requires editor role.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, approver, status, evidence]
              properties:
                title:
                  type: string
                approver:
                  type: string
                status:
                  type: string
                evidence:
                  type: string
                stage:
                  type: string
                role:
                  type: string
                dueDate:
                  type: string
                requiredApprovers:
                  type: array
                  items:
                    type: string
                decisionId:
                  type: string
      responses:
        "201":
          description: Approval created
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  # ─── Governance ──────────────────────────────────────────────────────────────
  /api/governance:
    get:
      tags: [Governance]
      summary: Get governance state
      description: Returns all decisions, actions, and a governance summary across the workspace. Requires viewer role.
      responses:
        "200":
          description: Governance state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GovernanceResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/governance/decisions:
    post:
      tags: [Governance]
      summary: Create a governance decision
      description: Add a decision to the active project. Requires editor role.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title]
              properties:
                title:
                  type: string
                ownerId:
                  type: string
                rationale:
                  type: string
                assumptions:
                  type: array
                  items:
                    type: string
                riskIds:
                  type: array
                  items:
                    type: string
                status:
                  type: string
      responses:
        "201":
          description: Decision created
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/governance/actions:
    post:
      tags: [Governance]
      summary: Create a governance action
      description: Add an action item to the active project. Requires editor role.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title]
              properties:
                title:
                  type: string
                owner:
                  type: string
                status:
                  type: string
                dueDate:
                  type: string
                decisionId:
                  type: string
      responses:
        "201":
          description: Action created
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  # ─── Alerts ──────────────────────────────────────────────────────────────────
  /api/alerts:
    get:
      tags: [Alerts]
      summary: Get workspace alerts
      description: Returns automated alerts for risks, financial issues, and control follow-ups across the workspace. Requires viewer role.
      responses:
        "200":
          description: Alert list
          content:
            application/json:
              schema:
                type: object
                properties:
                  alerts:
                    type: array
                    items:
                      $ref: "#/components/schemas/Alert"
                  count:
                    type: integer
                  revision:
                    type: string
        "401":
          $ref: "#/components/responses/Unauthorized"

  # ─── Automation ──────────────────────────────────────────────────────────────
  /api/automation:
    get:
      tags: [Automation]
      summary: Get automation plan
      description: Returns governed automation jobs across the workspace. Requires viewer role.
      responses:
        "200":
          description: Automation plan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AutomationResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/automation/run:
    post:
      tags: [Automation]
      summary: Run automation queue
      description: Queue all due automation jobs and log them to the audit trail. Requires editor role.
      responses:
        "202":
          description: Jobs queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AutomationResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/automation/ack:
    post:
      tags: [Automation]
      summary: Acknowledge an automation job
      description: Record that a human has acknowledged a governed automation job. Requires editor role.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [jobId, action, actor]
              properties:
                jobId:
                  type: string
                action:
                  type: string
                  maxLength: 500
                actor:
                  type: string
      responses:
        "201":
          description: Job acknowledged
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/jobs/claim:
    post:
      tags: [Automation]
      summary: Claim a pending automation job
      description: Acquires a durable, time-bounded worker lease. A second worker cannot claim the job while the lease is active.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [jobId, workerId]
              properties:
                jobId:
                  type: string
                workerId:
                  type: string
                leaseMs:
                  type: integer
                  minimum: 1
      responses:
        "201":
          description: Job claimed
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Job not found
        "409":
          description: Job is already claimed or not pending

  /api/jobs/release:
    post:
      tags: [Automation]
      summary: Release a worker lease
      description: Returns a running job to pending. Only the lease owner or an expired lease can be released.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [jobId, workerId]
              properties:
                jobId:
                  type: string
                workerId:
                  type: string
      responses:
        "200":
          description: Job released
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Job not found
        "409":
          description: Job is not running or worker does not own the lease

  /api/jobs/renew:
    post:
      tags: [Automation]
      summary: Renew a worker lease
      description: Extends an active lease for its owning worker. Expired leases and ownership mismatches are rejected.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [jobId, workerId]
              properties:
                jobId:
                  type: string
                workerId:
                  type: string
                leaseMs:
                  type: integer
                  minimum: 1
      responses:
        "200":
          description: Lease renewed
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Worker does not own the lease
        "404":
          description: Job not found
        "409":
          description: Lease expired or job is not running

  /api/jobs/complete:
    post:
      tags: [Automation]
      summary: Record a worker execution receipt
      description: Records an idempotent execution receipt for a leased job and transitions it to delivered or retry/dead-letter state. The endpoint records results; it does not execute arbitrary code.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [jobId, workerId, executionKey]
              properties:
                jobId:
                  type: string
                workerId:
                  type: string
                executionKey:
                  type: string
                outcome:
                  type: string
                  enum: [completed, failed]
                output:
                  type: object
                verification:
                  type: object
                compensation:
                  type: object
      responses:
        "201":
          description: Execution receipt recorded
        "200":
          description: Existing receipt returned for a duplicate execution key
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Worker does not own the lease or approval-tier authorization is missing
        "404":
          description: Job not found
        "409":
          description: Job is not running or its lease expired

  /api/trust/anchor:
    get:
      tags: [Trust]
      summary: Get the latest external chain anchor
      description: Returns the root-hash anchor of every hash chain plus a timestamp and anchor id — the point-in-time notarization anyone can verify independently.
      responses:
        "200":
          description: Chain anchor
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/trust/anchor/verify:
    post:
      tags: [Trust]
      summary: Verify all chains against an anchor
      description: Recomputes every chain's root hash and compares it with the supplied anchor. Tampering since the anchor was cut is detected and reported per chain.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [anchor]
              properties:
                anchor:
                  type: object
      responses:
        "200":
          description: Verification result
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/consistency/scan:
    get:
      tags: [Trust]
      summary: Cross-module consistency scan
      description: Extracts every figure the registers share (budget vs EVM vs KRI thresholds, finance vs risk) and flags irreconcilable values as alerts — the "linked together" trust check.
      responses:
        "200":
          description: Consistency report
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/retention/policy:
    get:
      tags: [Privacy]
      summary: Get retention schedules and legal holds
      description: Returns the configured retention schedules per register and any active legal-hold freezes.
      responses:
        "200":
          description: Retention policy
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/retention/hold:
    post:
      tags: [Privacy]
      summary: Freeze a record under legal hold
      description: Marks a register row as legally held so it survives retention purges. Requires editor role.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [regId, rowId, reason]
              properties:
                regId:
                  type: string
                rowId:
                  type: string
                reason:
                  type: string
      responses:
        "201":
          description: Hold applied
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/retention/purge:
    post:
      tags: [Privacy]
      summary: Dry-run or execute a retention purge
      description: Without confirm purges nothing and reports what would be deleted; with confirm true deletes expired, non-held records. Requires admin role for execution.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                confirm:
                  type: boolean
      responses:
        "200":
          description: Purge report
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/people/index:
    get:
      tags: [People]
      summary: Get the canonical person master-index
      description: Returns deduplicated people with aliases resolved to canonical identities — one person, one record, across feedback, conflicts, reviews, mentorship and successions.
      responses:
        "200":
          description: Person index
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/people/resolve:
    post:
      tags: [People]
      summary: Resolve a name/alias to a canonical person
      description: Looks up the canonical person for a raw name, merging aliases deterministically.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
      responses:
        "200":
          description: Resolved person
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/capabilities/people/churn-risk:
    post:
      tags: [People]
      summary: Calculate a deterministic churn-risk assessment
      description: Computes a non-persistent assessment from the supplied person and context data. The result must not be used as the sole basis for employment decisions.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                person:
                  type: object
                context:
                  type: object
      responses:
        "200":
          description: Churn score and risk band
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/capabilities/trust/score:
    post:
      tags: [Governance]
      summary: Calculate a trustworthiness score
      description: Returns component and overall trust scores from supplied quality, reliability, explainability, and audit factors.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          description: Trust score
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/capabilities/causal/propagate:
    post:
      tags: [Governance]
      summary: Propagate a causal domain event
      description: Calculates cross-domain impacts and records the request in the tenant-scoped domain-event audit chain without executing downstream actions.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [event]
              properties:
                event:
                  type: object
                domainStates:
                  type: object
      responses:
        "201":
          description: Audited propagation results
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/mentorship/match:
    get:
      tags: [People]
      summary: Generate mentorship pairings
      description: Pairs mentees with mentors by declared skill gaps, seniority direction and availability — deterministic, needs-driven pairing.
      responses:
        "200":
          description: Mentorship matches
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/mentorship/succession:
    get:
      tags: [People]
      summary: Succession-readiness assessment
      description: For each role, lists the ready-now and ready-in-time candidates based on skills, experience and feedback signals.
      responses:
        "200":
          description: Succession plan
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/incidents:
    get:
      tags: [Risk]
      summary: List incidents
      description: Returns the incident register with open/critical counts, overdue corrective actions and lessons learned.
      responses:
        "200":
          description: Incident register
        "401":
          $ref: "#/components/responses/Unauthorized"

      tags: [Risk]
      summary: Open an incident
      description: Opens an incident from severity (or from a KRI breach) and assigns the escalation policy responders.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, severity]
              properties:
                title:
                  type: string
                severity:
                  type: integer
                source:
                  type: object
      responses:
        "201":
          description: Incident opened
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/incidents/action:
    post:
      tags: [Risk]
      summary: Escalate, record RCA, add/complete corrective actions, close
      description: Drives an incident through its lifecycle. Closing requires a recorded RCA and all corrective actions completed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [incidentId, action]
              properties:
                incidentId:
                  type: string
                action:
                  type: string
                  enum: [escalate, rca, corrective, complete-corrective, close]
      responses:
        "201":
          description: Incident updated
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/experiments:
    get:
      tags: [Experiments]
      summary: List intervention experiments
      description: Returns the A/B intervention experiments (recognition, coaching, 1:1 cadence...) with outcome counts.
      responses:
        "200":
          description: Experiment list
        "401":
          $ref: "#/components/responses/Unauthorized"

      tags: [Experiments]
      summary: Create an experiment
      description: Creates an experiment with variants; exactly one variant must be marked control. Assignment is deterministic per seed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, hypothesis, variants]
              properties:
                name:
                  type: string
                hypothesis:
                  type: string
                unitType:
                  type: string
                metric:
                  type: string
                seed:
                  type: string
                variants:
                  type: array
                  items:
                    type: object
      responses:
        "201":
          description: Experiment created
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/experiments/assign:
    post:
      tags: [Experiments]
      summary: Deterministically assign units to variants
      description: Assigns units to variants from the experiment seed. Reproducible and balanced.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [experimentId, units]
              properties:
                experimentId:
                  type: string
                units:
                  type: array
                  items:
                    type: string
      responses:
        "201":
          description: Assignments persisted
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/experiments/outcome:
    post:
      tags: [Experiments]
      summary: Record an outcome for an assigned unit
      description: Records the unit's measured value; the variant is traced from the deterministic assignment. Unassigned units are rejected.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [experimentId, unitId, value]
              properties:
                experimentId:
                  type: string
                unitId:
                  type: string
                value:
                  type: number
      responses:
        "201":
          description: Outcome recorded
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/experiments/analyze:
    post:
      tags: [Experiments]
      summary: Analyze an experiment
      description: Per-variant stats, lift, Welch's t-test significance and a Bayesian Beta posterior on "better than control". Small samples report inconclusive.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [experimentId]
              properties:
                experimentId:
                  type: string
      responses:
        "200":
          description: Analysis result
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/automation/evidence:
    get:
      tags: [Automation]
      summary: List proof-of-execution evidence
      description: Returns the tamper-evident evidence log of what automation actually ran — job id, input snapshot, output, chain-verified.
      responses:
        "200":
          description: Evidence log
        "401":
          $ref: "#/components/responses/Unauthorized"

      tags: [Automation]
      summary: Record proof-of-execution evidence
      description: Appends an idempotent proof-of-execution receipt to the hash-chained evidence log. Reusing an execution key returns the existing receipt without appending a duplicate.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [jobId, executionKey, type]
              properties:
                jobId:
                  type: string
                executionKey:
                  type: string
                type:
                  type: string
                inputSnapshot:
                  type: object
                output:
                  type: object
                outcome:
                  type: string
                compensation:
                  type: object
      responses:
        "201":
          description: Evidence recorded
        "200":
          description: Existing evidence returned for a duplicate execution key
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  # ─── Policy engine (round-16) ─────────────────────────────────────────────
  /api/policy:
    get:
      tags: [Governance]
      summary: List the active policy rules and recent decisions
      description: Returns the declarative policy rule set (finance thresholds, risk escalation, automation default-deny) plus a summary of recent decisions.
      responses:
        "200":
          description: Policy + decision summary
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/policy/evaluate:
    post:
      tags: [Governance]
      summary: Evaluate an action against the policy engine
      description: Returns allow/review/block with the matched rule and reason. Every decision is explainable and audited.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [domain, appliesTo]
              properties:
                domain:
                  type: string
                appliesTo:
                  type: string
                amount:
                  type: number
                currency:
                  type: string
                rpn:
                  type: number
                role:
                  type: string
      responses:
        "200":
          description: Decision (allow/review/block + matched rule)
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  # ─── Outbound webhooks (round-16) ─────────────────────────────────────────
  /api/webhooks:
    get:
      tags: [Alerts]
      summary: List outbound webhook subscriptions
      description: Returns registered outbound webhooks (channel, events, active, dead-letter state).
      responses:
        "200":
          description: Webhook list
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [Alerts]
      summary: Register an outbound webhook
      description: Adds a Slack/Teams/generic webhook subscription with HMAC signing and retry/dead-letter semantics.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url, events]
              properties:
                url:
                  type: string
                events:
                  type: array
                  items:
                    type: string
                channel:
                  type: string
                  enum: [slack, teams, generic]
                secret:
                  type: string
      responses:
        "201":
          description: Registered
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/webhooks/dispatch:
    post:
      tags: [Alerts]
      summary: Dispatch an event to outbound webhooks
      description: Manually or programmatically fire an event (e.g. risk.raised) through the outbound delivery pipeline.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [event]
              properties:
                event:
                  type: string
                payload:
                  type: object
      responses:
        "200":
          description: Dispatch results per subscription
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  # ─── Bank-feed connector (round-16) ────────────────────────────────────────
  /api/connector/bank-import:
    post:
      tags: [Finance]
      summary: Import a bank feed via the connector
      description: Runs the pluggable bank-feed connector (bik CSV or sandbox), dedupes against prior transactions, and records hash-chained import evidence.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [provider]
              properties:
                provider:
                  type: string
                  enum: [bik, sandbox, http]
                source:
                  type: string
                  description: Raw CSV text for the bik provider; sandbox token 'sandbox-token'; URL for http.
      responses:
        "201":
          description: Import result with transactions + evidence
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  # ─── OIDC SSO (round-16) ───────────────────────────────────────────────────
  /api/oidc/start:
    get:
      tags: [Auth]
      summary: Start OIDC authorization-code flow
      description: Discovers the issuer's OpenID configuration and returns the authorization URL. 503 until LEADERSHIP_OIDC_* env vars are set.
      responses:
        "200":
          description: Authorization URL
        "503":
          description: OIDC not configured

  /api/oidc/callback:
    post:
      tags: [Auth]
      summary: Complete OIDC login (exchange code, verify ID token)
      description: Exchanges the authorization code, fetches JWKS, verifies the ID token signature + claims, and derives the platform role from group claims.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, nonce]
              properties:
                code:
                  type: string
                nonce:
                  type: string
      responses:
        "200":
          description: Verified SSO claims + derived role
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          description: Token verification failed
        "503":
          description: OIDC not configured

  # ─── Usage analytics (round-16) ────────────────────────────────────────────
  /api/analytics/usage:
    get:
      tags: [Metrics]
      summary: Local usage analytics report
      description: Returns route adoption, unique users and dead-end detection from the in-memory capture. Nothing leaves the device.
      parameters:
        - name: hours
          in: query
          schema:
            type: integer
            default: 720
      responses:
        "200":
          description: Usage report
        "401":
          $ref: "#/components/responses/Unauthorized"

  # ─── Round-17: control center, learning, risk portfolio, evidence pack ────
  /api/control-center:
    get:
      tags: [Governance]
      summary: Aggregated governance snapshot
      description: One view of the machine's behavior — policy decisions, approval backlog, incident count, automation/webhook dead-letters, evidence integrity, kill-switch and a 0-100 governance score with EXPLICIT component penalties.
      responses:
        "200":
          description: Governance snapshot + score
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/policy/recalibrate:
    post:
      tags: [Governance]
      summary: Recalibrate policy rules from automation acks (learning loop)
      description: Feeds the last accept/decline ack records into the policy engine. Rules auto-promote to allow at >=90% acceptance and downgrade to review at <=50%. Every change is audited.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [acks]
              properties:
                acks:
                  type: array
                  items:
                    type: object
                    properties:
                      ruleId:
                        type: string
                      action:
                        type: string
                        enum: [accept, decline]
      responses:
        "200":
          description: Recalibrated rules
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/learning/weekly:
    get:
      tags: [Personal]
      summary: Weekly personal-to-OKR insight
      description: Links habits, reflections and energy registers to OKR movement and returns a coaching brief. Deterministic; 404 without an active project.
      responses:
        "200":
          description: Weekly insight brief
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: No active project

  /api/learning/experiments:
    get:
      tags: [Experiments]
      summary: Experiment auto-stop decisions
      description: For every running intervention experiment, the auto-stop recommendation (sufficient n + significant/bayesian signal) plus the reason.
      responses:
        "200":
          description: Experiments with auto-stop decisions
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/evidence/package:
    get:
      tags: [Audit]
      summary: Build a tamper-evident evidence pack
      description: Point-in-time package of audit chain, approvals, control test results, incident register, automation evidence, finance integrity and the external chain anchor — with a SHA-256 manifest so the pack itself can be independently verified.
      responses:
        "200":
          description: Evidence pack with manifest
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/risk/portfolio:
    get:
      tags: [Risk]
      summary: Portfolio-level risk aggregation
      description: Top systemic risks across projects (theme clusters), RAROC-lite, and the vendor risk feed.
      responses:
        "200":
          description: Portfolio risk report
        "401":
          $ref: "#/components/responses/Unauthorized"

  # ─── Round-18: period close, decision outcomes, conflict outcomes, secrets ──
  /api/finance/close:
    post:
      tags: [Finance]
      summary: Close a period with a certificate
      description: Freezes the period (no automated postings), verifies the trial balance, and returns a close certificate with SHA-256 manifest + anchor. Requires admin; 409 if already closed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [period]
              properties:
                period:
                  type: string
                  description: e.g. 2026-08
                approvedBy:
                  type: string
                reason:
                  type: string
      responses:
        "201":
          description: Closed + certificate
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          description: Already closed

  /api/finance/close/reopen:
    post:
      tags: [Finance]
      summary: Reopen a sealed period (audited)
      description: The only way to change a closed period; every reopen is written to the audit chain with actor + reason.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [period]
              properties:
                period:
                  type: string
                reason:
                  type: string
      responses:
        "200":
          description: Reopened + audit event
        "409":
          description: Not frozen

  /api/finance/close/status:
    get:
      tags: [Finance]
      summary: Which periods are sealed
      responses:
        "200":
          description: Frozen periods

  /api/decisions/outcomes:
    get:
      tags: [Decisions]
      summary: Decision outcome ledger + calibration
      description: Registered decisions with expected outcomes, plus per-domain calibration (strong/acceptable/weak) and stale reviews.
      responses:
        "200":
          description: Ledger + calibration + stale
    post:
      tags: [Decisions]
      summary: Register a decision outcome expectation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id, decision]
              properties:
                id: { type: string }
                decision: { type: string }
                domain: { type: string, default: strategy }
